<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Particle Input</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.5);
            --input-bg: rgba(255, 255, 255, 0.03);
            --input-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .ui-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 16px 24px;
            font-size: 18px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 16px;
            color: var(--text-color);
            text-align: center;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            font-family: var(--font-main);
            letter-spacing: 1px;
        }

        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Hide the actual text visually but keep it for accessibility/typing */
        /* The particles will represent the text */
        .particle-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hint {
            position: absolute;
            bottom: -40px;
            left: 0;
            right: 0;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head><body >

    <canvas id="canvas" width="719" height="1338" style="width: 411px; height: 765px;"></canvas>

    <div class="ui-container" data-gunt-id="gunt-1">
        <div class="input-wrapper" data-gunt-id="gunt-2" style="transform: none; left: 2.71375px; top: 106.269px;">
            <input type="text" id="textInput" placeholder="Type something..." autocomplete="off">
            <div class="hint" data-gunt-id="gunt-3">Interactive Particle Experience</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const input = document.getElementById('textInput');
        
        // Virtual canvas for text sampling
        const vCanvas = document.createElement('canvas');
        const vCtx = vCanvas.getContext('2d', { willReadFrequently: true });

        let width, height;
        let particles = [];
        let mouse = { x: -1000, y: -1000, radius: 80 };
        
        const config = {
            particleColor: '#00f2ff',
            particleSize: 1.5,
            sampleRate: 4, // Lower = more particles (performance cost)
            ease: 0.08,
            friction: 0.9,
            floatAmplitude: 1.5,
            floatSpeed: 0.05
        };

        class Particle {
            constructor(x, y) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.destX = x;
                this.destY = y;
                this.vx = 0;
                this.vy = 0;
                this.baseX = x;
                this.baseY = y;
                this.size = config.particleSize;
                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                // Float motion
                this.angle += config.floatSpeed;
                const floatX = Math.cos(this.angle) * config.floatAmplitude;
                const floatY = Math.sin(this.angle) * config.floatAmplitude;

                // Spring physics to target
                const dx = (this.destX + floatX) - this.x;
                const dy = (this.destY + floatY) - this.y;
                
                this.vx += dx * config.ease;
                this.vy += dy * config.ease;
                this.vx *= config.friction;
                this.vy *= config.friction;

                this.x += this.vx;
                this.y += this.vy;

                // Mouse Repulsion
                const mdx = this.x - mouse.x;
                const mdy = this.y - mouse.y;
                const dist = Math.sqrt(mdx * mdx + mdy * mdy);
                if (dist < mouse.radius) {
                    const force = (mouse.radius - dist) / mouse.radius;
                    this.vx += (mdx / dist) * force * 5;
                    this.vy += (mdy / dist) * force * 5;
                }
            }

            draw() {
                ctx.fillStyle = config.particleColor;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
        }

        function getTextPixels(text) {
            const fontSize = Math.min(width / (text.length * 0.6), 120);
            vCanvas.width = width;
            vCanvas.height = height;
            
            vCtx.fillStyle = 'white';
            vCtx.font = `bold ${fontSize}px ${getComputedStyle(document.body).fontFamily}`;
            vCtx.textAlign = 'center';
            vCtx.textBaseline = 'middle';
            vCtx.fillText(text, width / 2, height / 2);

            const imageData = vCtx.getImageData(0, 0, width, height).data;
            const points = [];

            for (let y = 0; y < height; y += config.sampleRate) {
                for (let x = 0; x < width; x += config.sampleRate) {
                    const index = (y * width + x) * 4;
                    if (imageData[index + 3] > 128) {
                        points.push({ x, y });
                    }
                }
            }
            return points;
        }

        function updateParticles() {
            const text = input.value;
            const points = getTextPixels(text);
            
            if (points.length === 0) {
                // Fade out particles if input is empty
                particles = []; 
                return;
            }

            // Match particle count to pixel count
            if (particles.length < points.length) {
                for (let i = particles.length; i < points.length; i++) {
                    particles.push(new Particle(points[i].x, points[i].y));
                }
            } else if (particles.length > points.length) {
                particles.splice(points.length);
            }

            // Update target destinations
            for (let i = 0; i < particles.length; i++) {
                particles[i].destX = points[i].x;
                particles[i].destY = points[i].y;
                particles[i].baseX = points[i].x;
                particles[i].baseY = points[i].y;
            }
        }

        function animate() {
            // Clear with slight trail effect
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Neon glow effect
            ctx.shadowBlur = 8;
            ctx.shadowColor = config.particleColor;

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            
            ctx.shadowBlur = 0;
            requestAnimationFrame(animate);
        }

        // Events
        window.addEventListener('resize', resize);
        
        input.addEventListener('input', updateParticles);
        
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchstart', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });

        window.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });

        window.addEventListener('touchend', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        // Initialize
        resize();
        animate();
        
        // Default text to start
        input.value = "GUNT AI";
        updateParticles();

    </script>

</body>
